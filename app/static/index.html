<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FtpKDV</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#18212c;--panel2:#202c39;--line:#344454;--text:#e7edf5;--muted:#9cabbc;--accent:#59a7ff;--danger:#ef7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Arial}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0} .sub{color:var(--muted);font-size:12px;margin-top:3px}
main{padding:14px;max-width:1800px;margin:auto}
.connect{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;color:var(--muted)}
input{background:#0e141b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;min-width:90px}
#host{width:200px}#username{width:140px}#password{width:160px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}button.primary{background:#1e5d9e;border-color:#367ec2}button.danger{color:#ffaaaa}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:0;overflow:hidden}
.pane-head{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.pane-title{font-weight:700}.pathbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.pathbar input{flex:1;min-width:0}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:9px;border-bottom:1px solid var(--line)}
.table-wrap{overflow:auto;max-height:calc(100vh - 340px);min-height:300px}
table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #2b3947;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{position:sticky;top:0;background:#202c39;color:var(--muted);font-size:11px;text-transform:uppercase}
tr{cursor:pointer}tbody tr:hover{background:#233344}tr.selected{background:#183d5d}
.name{width:58%}.size{width:20%;text-align:right}.kind{width:22%;color:var(--muted)}
.status{color:var(--muted);font-size:12px;padding:10px 12px;min-height:36px}
.bottom{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.transfer-overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.transfer-dialog{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 20px 70px #0008}
.transfer-dialog h2{font-size:18px;margin:0 0 8px}.transfer-meta{display:flex;justify-content:space-between;gap:12px;margin:12px 0;color:var(--muted);font-size:13px}
.progress-track{height:14px;background:#0b1118;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .2s ease}.progress-fill.indeterminate{width:35%;animation:transfer-sweep 1.2s ease-in-out infinite alternate}@keyframes transfer-sweep{from{transform:translateX(0)}to{transform:translateX(185%)}}.transfer-actions{display:flex;justify-content:flex-end;margin-top:14px}
@media(max-width:850px){.panes{grid-template-columns:1fr}.table-wrap{max-height:55vh}.connect{align-items:stretch}.field{flex:1}#host,#username,#password{width:100%}}
</style>
</head>
<body>
<header><div><h1>FtpKDV</h1><div class="sub">Двухпанельный файловый менеджер для Docker</div></div><div id="connectionLabel" class="sub">FTP не подключён</div></header>
<main>
<section class="connect">
 <div class="field"><label>Подключить FTP к панели</label><select id="connectTarget"><option value="right">Правой панели</option><option value="left">Левой панели</option></select></div>
 <div class="field"><label>FTP-сервер</label><input id="host" placeholder="ftp.example.com"></div>
 <div class="field"><label>Порт</label><input id="port" type="number" value="21" style="width:80px"></div>
 <div class="field"><label>Логин</label><input id="username" value="anonymous"></div>
 <div class="field"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"></div>
 <button class="primary" id="connectBtn">Подключиться</button><button id="disconnectBtn">Отключиться</button>
</section>
<section class="panes">
 <div class="pane">
  <div class="pane-head"><span class="pane-title" id="leftTitle">▣ Локальная панель</span><span class="sub" id="leftState">Docker /workspace</span></div>
  <div class="pathbar"><select id="leftMode" aria-label="Источник левой панели"><option value="local">Локальные файлы</option><option value="ftp">FTP-сервер</option></select><input id="localPath" value="/" aria-label="Путь левой панели"><button id="localGo">Открыть</button></div>
  <div class="actions"><button id="localUp">↑ Вверх</button><button id="localMkdir">＋ Папка</button><button id="localRename">Переименовать</button><button class="danger" id="localDelete">Удалить</button></div>
  <div class="table-wrap"><table><thead><tr><th class="name">Имя</th><th class="size">Размер</th><th class="kind">Тип</th></tr></thead><tbody id="localRows"></tbody></table></div>
  <div class="status" id="localStatus">Готово</div>
 </div>
 <div class="pane">
  <div class="pane-head"><span class="pane-title">⇄ FTP-сервер</span><span class="sub" id="remoteState">Отключён</span></div>
  <div class="pathbar"><input id="remotePath" value="/" aria-label="Удалённый путь"><button id="remoteGo">Открыть</button></div>
  <div class="actions"><button id="remoteUp">↑ Вверх</button><button id="remoteMkdir">＋ Папка</button><button id="remoteRename">Переименовать</button><button class="danger" id="remoteDelete">Удалить</button></div>
  <div class="table-wrap"><table><thead><tr><th class="name">Имя</th><th class="size">Размер</th><th class="kind">Тип</th></tr></thead><tbody id="remoteRows"></tbody></table></div>
  <div class="status" id="remoteStatus">Сначала подключитесь к FTP</div>
 </div>
</section>
<div class="bottom"><button class="primary" id="downloadBtn">← Скачать в локальную панель</button><button class="primary" id="uploadBtn">Загрузить на FTP →</button></div>
<div class="status" id="globalStatus">Выберите файл в панели и выполните действие.</div>
</main>
<div class="transfer-overlay" id="transferOverlay" role="dialog" aria-modal="true" aria-labelledby="transferTitle">
 <div class="transfer-dialog">
  <h2 id="transferTitle">Копирование файла</h2>
  <div id="transferFileName" class="sub">Подготовка…</div>
  <div class="transfer-meta"><span id="transferPhase">Подготовка</span><strong id="transferPercent">0%</strong></div>
  <div class="progress-track"><div class="progress-fill" id="transferProgress"></div></div>
  <div class="transfer-meta"><span>Скорость: <strong id="transferSpeed">0 Б/с</strong></span><span id="transferBytes">0 Б</span></div>
  <div id="transferError" class="status" style="padding-left:0;color:var(--danger)"></div>
  <div class="transfer-actions"><button id="transferClose" disabled>Закрыть</button></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
let sid=null, leftSid=null, rightSid=null, localItems=[], remoteItems=[], localSelected=null, remoteSelected=null;
let leftMode='local', leftPath='/', leftItems=[], leftSelected=null;
async function api(url,opts={}) {
 const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});
 const data=await r.json().catch(()=>({detail:r.statusText}));
 if(!r.ok) throw new Error(data.detail||'Ошибка запроса'); return data;
}
function message(s){$('globalStatus').textContent=s}
function fmt(n){if(!n)return '—';const u=['Б','КБ','МБ','ГБ','ТБ'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return (i?v.toFixed(1):v)+' '+u[i]}
function parentPath(p){p=(p||'/').replace(/\/+$/,'')||'/';if(p==='/')return '/';let i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)}
function join(p,n){return (p==='/'?'':p.replace(/\/+$/,''))+'/'+n}
function render(which,data){
 const isLocal=which==='local', tbody=$(which+'Rows'), items=data.items||[];
 if(isLocal){localItems=items;localSelected=null;leftItems=items;leftSelected=null;$('localPath').value=data.path}
 else{remoteItems=items;remoteSelected=null;$('remotePath').value=data.path}
 tbody.innerHTML='';
 for(const item of items){
  const tr=document.createElement('tr');tr.dataset.name=item.name;
  const name=document.createElement('td');name.className='name';name.textContent=(item.type==='dir'?'📁 ':'📄 ')+item.name;
  const size=document.createElement('td');size.className='size';size.textContent=item.type==='dir'?'—':fmt(item.size);
  const kind=document.createElement('td');kind.className='kind';kind.textContent=item.type==='dir'?'Папка':'Файл';
  tr.append(name,size,kind);
  tr.addEventListener('click',()=>{tbody.querySelectorAll('tr').forEach(x=>x.classList.remove('selected'));tr.classList.add('selected');if(isLocal)localSelected=item;else remoteSelected=item;});
  tr.addEventListener('dblclick',()=>{if(item.type==='dir'){const path=join($(which+'Path').value,item.name);$(which+'Path').value=path;refresh(which)}});
  tbody.append(tr);
 }
 $(which+'Status').textContent=`Элементов: ${items.length}`;
}
function sessionFor(which){ return which==='local' ? leftSid : rightSid; }
async function refresh(which){
 try{
  if(which==='local'){
    if(leftMode==='local') render('local',await api('/api/local/list?path='+encodeURIComponent($('localPath').value)));
    else {if(!leftSid)throw new Error('Подключите FTP к левой панели');render('local',await api(`/api/ftp/${leftSid}/list?path=`+encodeURIComponent($('localPath').value)));$('leftTitle').textContent='⇄ FTP-сервер';$('leftState').textContent='FTP подключён';}
  } else {if(!rightSid)throw new Error('Подключите FTP к правой панели');render('remote',await api(`/api/ftp/${rightSid}/list?path=`+encodeURIComponent($('remotePath').value)))}
 }catch(e){message(e.message);$(which+'Status').textContent=e.message}
}
$('connectBtn').onclick=async()=>{
 try{
  const target=$('connectTarget').value;
  message('Подключение…');
  const d=await api('/api/ftp/connect/'+target,{method:'POST',body:JSON.stringify({host:$('host').value.trim(),port:Number($('port').value)||21,username:$('username').value,password:$('password').value,passive:true})});
  if(target==='left'){leftSid=d.session_id;leftMode='ftp';$('leftMode').value='ftp';$('localPath').value=d.path;$('leftTitle').textContent='⇄ FTP-сервер';$('leftState').textContent='FTP подключён';render('local',d);$('localStatus').textContent='FTP подключён'}
  else{rightSid=d.session_id;sid=rightSid;$('remotePath').value=d.path;$('remoteState').textContent='Подключён';render('remote',d)}
  $('connectionLabel').textContent='FTP подключён: '+$('host').value;
  message('FTP подключён к '+(target==='left'?'левой':'правой')+' панели');
 } catch(e){message(e.message)}
};
$('disconnectBtn').onclick=async()=>{
 for(const id of [leftSid,rightSid]) if(id){try{await api(`/api/ftp/${id}/disconnect`,{method:'POST'})}catch(e){}}
 leftSid=null;rightSid=null;sid=null;
 if(leftMode==='ftp'){leftMode='local';$('leftMode').value='local';$('leftTitle').textContent='▣ Локальная панель';$('leftState').textContent='Docker /workspace';$('localPath').value='/';await refresh('local')}
 $('remoteState').textContent='Отключён';$('connectionLabel').textContent='FTP не подключён';$('remoteRows').innerHTML='';$('remoteStatus').textContent='Сначала подключитесь к FTP';message('FTP-соединения отключены')
};
$('leftMode').onchange=async()=>{
 leftMode=$('leftMode').value;
 if(leftMode==='local'){$('leftTitle').textContent='▣ Локальная панель';$('leftState').textContent='Docker /workspace';$('localPath').value='/';}
 else{$('leftTitle').textContent='⇄ FTP-сервер';$('leftState').textContent=leftSid?'FTP подключён':'Не подключён';if(leftSid)$('localPath').value='/';}
 await refresh('local');
};
$('localGo').onclick=()=>refresh('local');$('remoteGo').onclick=()=>refresh('remote');
$('localUp').onclick=()=>{$('localPath').value=parentPath($('localPath').value);refresh('local')};
$('remoteUp').onclick=()=>{$('remotePath').value=parentPath($('remotePath').value);refresh('remote')};
async function mkdir(which){
 const name=prompt('Имя новой папки:');if(!name)return;
 try{const path=$(which+'Path').value;
  if(which==='local'&&leftMode==='local')await api('/api/local/mkdir',{method:'POST',body:JSON.stringify({path,name})});
  else {const s=which==='local'?leftSid:rightSid;if(!s)throw new Error('FTP не подключён');await api(`/api/ftp/${s}/mkdir`,{method:'POST',body:JSON.stringify({path,name})});}
  await refresh(which);message('Папка создана')}
 catch(e){message(e.message)}
}
async function rename(which){
 const item=which==='local'?localSelected:remoteSelected;if(!item)return message('Сначала выберите элемент');
 const name=prompt('Новое имя:',item.name);if(!name||name===item.name)return;
 try{const path=join($(which+'Path').value,item.name);if(which==='local'&&leftMode==='local')await api('/api/local/rename',{method:'POST',body:JSON.stringify({path,new_name:name})});else {const s=which==='local'?leftSid:rightSid;if(!s)throw new Error('FTP не подключён');await api(`/api/ftp/${s}/rename`,{method:'POST',body:JSON.stringify({path,new_name:name})});}await refresh(which);message('Переименовано')}
 catch(e){message(e.message)}
}
async function del(which){
 const item=which==='local'?localSelected:remoteSelected;if(!item)return message('Сначала выберите элемент');
 if(!confirm(`Удалить «${item.name}»? Это действие нельзя отменить.`))return;
 try{const path=join($(which+'Path').value,item.name);if(which==='local'&&leftMode==='local')await api('/api/local/delete',{method:'POST',body:JSON.stringify({path})});else {const s=which==='local'?leftSid:rightSid;if(!s)throw new Error('FTP не подключён');await api(`/api/ftp/${s}/delete`,{method:'POST',body:JSON.stringify({path})});}await refresh(which);message('Удалено')}
 catch(e){message(e.message)}
}
$('localMkdir').onclick=()=>mkdir('local');$('remoteMkdir').onclick=()=>mkdir('remote');
$('localRename').onclick=()=>rename('local');$('remoteRename').onclick=()=>rename('remote');
$('localDelete').onclick=()=>del('local');$('remoteDelete').onclick=()=>del('remote');
function showTransfer(name){
 $('transferOverlay').style.display='flex';$('transferFileName').textContent=name;
 $('transferPhase').textContent='Подготовка';$('transferPercent').textContent='0%';$('transferProgress').classList.remove('indeterminate');$('transferProgress').style.width='0%';
 $('transferSpeed').textContent='0 Б/с';$('transferBytes').textContent='0 Б';$('transferError').textContent='';$('transferClose').disabled=true;
}
function hideTransfer(){$('transferOverlay').style.display='none'}
$('transferClose').onclick=hideTransfer;
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function watchTransfer(taskId){
 while(true){
  const t=await api('/api/transfer/status/'+taskId);
  const known=t.percent!==null&&t.percent!==undefined;const percent=known?Math.max(0,Math.min(100,Number(t.percent)||0)):0;
  $('transferPhase').textContent=t.phase||'Копирование';$('transferPercent').textContent=known?percent+'%':(t.phase||'Скачивание')+': '+fmt(t.bytes_done||0);$('transferProgress').classList.toggle('indeterminate',!known);$('transferProgress').style.width=known?percent+'%':'35%';
  $('transferSpeed').textContent=(t.speed ? fmt(t.speed) : '0 Б')+'/с';
  $('transferBytes').textContent=t.total_bytes?`${fmt(t.bytes_done||0)} / ${fmt(t.total_bytes)}`:fmt(t.bytes_done||0)+' передано';
  if(t.status==='completed'){$('transferClose').disabled=false;message('Копирование завершено');return}
  if(t.status==='error'){$('transferError').textContent=t.error||'Неизвестная ошибка';$('transferClose').disabled=false;throw new Error(t.error||'Ошибка копирования')}
  await wait(500);
 }
}
async function transferFile(from,to){
 const src=from==='local'?localSelected:remoteSelected;
 const dstPath=$(to+'Path').value;
 if(!src||src.type!=='file')return message('Выберите файл в исходной панели');
 const fromLocal=from==='local'&&leftMode==='local';
 const toLocal=to==='local'&&leftMode==='local';
 const fromSid=from==='local'?leftSid:rightSid, toSid=to==='local'?leftSid:rightSid;
 const fromPath=join($(from+'Path').value,src.name), toPath=join(dstPath,src.name);
 const ftpToFtp=(from==='local'&&leftMode==='ftp'&&to==='remote')||(from==='remote'&&to==='local'&&leftMode==='ftp');
 try{
  if(ftpToFtp){
    if(!fromSid||!toSid)throw new Error('Обе FTP-панели должны быть подключены');
    showTransfer(src.name);message('Копирование между FTP-серверами…');
    const task=await api(`/api/transfer/ftp-copy/${fromSid}`,{method:'POST',body:JSON.stringify({source_path:fromPath,destination_session:toSid,destination_path:toPath,source_size:src.size||0})});
    await watchTransfer(task.task_id);
  }else{
    if(fromLocal&&to==='remote'){
      if(!toSid)throw new Error('FTP не подключён');
      showTransfer(src.name);message('Загрузка на FTP…');
      const task=await api(`/api/transfer/upload/${toSid}`,{method:'POST',body:JSON.stringify({local_path:fromPath,remote_path:toPath})});
      await watchTransfer(task.task_id);
    }else if(from==='remote'&&toLocal){
      if(!fromSid)throw new Error('FTP не подключён');
      showTransfer(src.name);message('Скачивание с FTP…');
      const task=await api(`/api/transfer/download/${fromSid}`,{method:'POST',body:JSON.stringify({local_path:toPath,remote_path:fromPath})});
      await watchTransfer(task.task_id);
    }else throw new Error('Неподдерживаемое направление передачи');
  }
  await refresh(to);message('Передача завершена');
 }catch(e){message(e.message);if($('transferOverlay').style.display==='flex'){$('transferError').textContent=e.message;$('transferClose').disabled=false}}
}
$('downloadBtn').onclick=()=>transferFile('remote','local');
$('uploadBtn').onclick=()=>transferFile('local','remote');
refresh('local');
</script>
</body>
</html>
